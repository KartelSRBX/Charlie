[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "charlie"
version = "0.1.0"
description = "A highly available ClickHouse cluster described as code: topology, configs, schema migrations, chaos tests"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "jinja2>=3.1,<4",
    "clickhouse-connect>=0.8,<2",
    "psycopg[binary]>=3.2,<4",
    "ldap3>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
charlie = "charlie.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/charlie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
filterwarnings = ["ignore:(tagMap|typeMap) is deprecated:DeprecationWarning"]
markers = ["e2e: needs the running docker stack (make up)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["charlie"]
