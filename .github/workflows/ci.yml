name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, unit tests, generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: deploy/ matches topology.yaml
        run: charlie check
      - name: Dashboards are up to date with their builder
        run: |
          python grafana/build_dashboards.py
          git diff --exit-code grafana/dashboards
      - name: Compose file is valid
        run: docker compose -f deploy/docker-compose.yml config --quiet

  e2e:
    name: Cluster and failure drills
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Start 3 Keepers, 4 ClickHouse servers, PostgreSQL and LDAP
        run: docker compose -f deploy/docker-compose.yml up -d --wait
      - name: "Apply the schema (twice, the second run must be a no-op)"
        run: |
          charlie migrate
          charlie migrate
      - name: Cluster is healthy
        run: charlie status
      - name: "Access as code: seed the demo directory, apply the model (twice), check for drift"
        env:
          SVC_LOADER_PASSWORD: loader-pass
          SVC_REPORTING_PASSWORD: report-pass
        run: |
          charlie directory seed
          charlie access plan
          charlie access apply
          charlie access apply | grep -c "in sync" | grep -qx 2
          charlie access drift
      - name: Load, then verify totals, duplicates and replica equality
        run: |
          charlie load --batches 20 --batch-size 5000
          charlie verify --expect 100000
      - name: Benchmarks run end to end (smoke test, the numbers are not meaningful here)
        run: charlie bench --quick --rows 200000
      - name: Prometheus scrapes every server and Keeper
        run: |
          sleep 15
          up=$(curl -s 'localhost:9090/api/v1/query?query=count(up==1)' | python -c "import json,sys; print(json.load(sys.stdin)['data']['result'][0]['value'][1])")
          echo "targets up: $up"
          test "$up" = 7
      - name: Access tests, backup drill and failure drills (replica, Keeper, quorum loss, whole shard, rolling restart)
        shell: bash
        env:
          SVC_LOADER_PASSWORD: loader-pass
          SVC_REPORTING_PASSWORD: report-pass
        run: pytest -m e2e tests/e2e -v --tb=short -rA 2>&1 | tee e2e.log
      - name: Failure report
        if: failure()
        run: |
          echo "=== pytest summary ==="
          grep -E "^(FAILED|ERROR|PASSED)|^E  |Error|assert" e2e.log | head -60 || true
          echo "=== cluster logs (tail) ==="
          docker compose -f deploy/docker-compose.yml logs --tail 30
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  upgrade:
    name: Rolling upgrade 24.3 to 24.8 under load
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Start the OLD version (Keepers and servers only)
        run: |
          sed -i 's/:24.8/:24.3/' topology.yaml
          charlie render
          docker compose -f deploy/docker-compose.yml up -d --wait \
            $(docker compose -f deploy/docker-compose.yml config --services | grep -E '^(keeper|ch-)')
          charlie migrate
          charlie load --batches 40 --batch-size 5000
      - name: Declare the new version in topology.yaml and render it
        run: |
          git checkout topology.yaml
          charlie render
          git diff --stat deploy
      - name: Rolling upgrade, writing and reading all the while
        run: charlie upgrade
      - name: Cluster is healthy and consistent afterwards
        run: |
          charlie status
          charlie verify
      - name: Failure report
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail 40
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
