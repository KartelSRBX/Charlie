name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, unit tests, generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: deploy/ matches topology.yaml
        run: charlie check
      - name: Dashboards are up to date with their builder
        run: |
          python grafana/build_dashboards.py
          git diff --exit-code grafana/dashboards
      - name: Compose file is valid
        run: docker compose -f deploy/docker-compose.yml config --quiet

  e2e:
    name: Cluster and failure drills
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Start 3 Keepers and 4 ClickHouse servers
        run: docker compose -f deploy/docker-compose.yml up -d --wait
      - name: Apply the schema (twice: the second run must be a no-op)
        run: |
          charlie migrate
          charlie migrate
      - name: Cluster is healthy
        run: charlie status
      - name: Load, then verify totals, duplicates and replica equality
        run: |
          charlie load --batches 20 --batch-size 5000
          charlie verify --expect 100000
      - name: Prometheus scrapes every server and Keeper
        run: |
          sleep 15
          up=$(curl -s 'localhost:9090/api/v1/query?query=count(up==1)' | python -c "import json,sys; print(json.load(sys.stdin)['data']['result'][0]['value'][1])")
          echo "targets up: $up"
          test "$up" = 7
      - name: Failure drills (replica, Keeper, quorum loss, whole shard, rolling restart)
        run: pytest -m e2e tests/e2e -v
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail 150
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
