# The single source of truth for the cluster shape.
# `charlie render` turns this file into everything under deploy/ (compose file, ClickHouse and
# Keeper configs, Prometheus scrape config). CI fails if deploy/ drifts from this file.
cluster: charlie

images:
  server: clickhouse/clickhouse-server:24.8
  keeper: clickhouse/clickhouse-keeper:24.8

# Raft quorum for replication metadata. Must be odd: 3 tolerates one failure, 5 tolerates two.
keepers: 3

# Shards split the data, replicas copy it. 2 x 2 survives the loss of any one replica per shard.
shards: 2
replicas: 2

# Host ports published for convenience; nodes talk to each other on the compose network.
ports:
  http_base: 8123      # ch-s1-r1 -> 8123, ch-s1-r2 -> 8124, ch-s2-r1 -> 8125, ...
  native_base: 9000
  keeper_base: 9181    # keeper-1 -> 9181 (four-letter-word commands for `charlie status`)
  prometheus: 9090
  grafana: 3000

# Optional neighbours for the access-as-code stage: one model, compiled for two engines, with
# group membership coming from an LDAP directory. Delete a block to leave that part out.
postgres:
  image: postgres:16-alpine
  port: 5432
  database: app

ldap:
  image: osixia/openldap:1.5.0
  port: 3890
  domain: charlie.local
